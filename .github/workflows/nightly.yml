# nightly.yml -- lite-bisect daily run on the newest node and the engines floor (P3 burst 1; ruling P3-R5, plus
# P3-R3 / P3-R6 / P3-R7 as in ci.yml). DETERMINISTIC tier only (ROADMAP 6): no quiet lock, no timed step.
# SYNC: the same steps as ci.yml (keep the two `test` step lists and the two coverage-size jobs in sync; only the
# ci 26.8.2 pin guard and this file's setup-node check-latest differ), on node 'latest' and '22' (check-latest:
# the newest release every night) x ubuntu-latest / macos-latest, plus the same separate coverage + size job
# (ubuntu-latest, node 26).
# Never a required check. GitHub runs a schedule only from the default branch and, in a public repository, pauses
# it after 60 days without repository activity (re-enable in the Actions tab).
# The STATISTICAL A/B lane is NOT here: it comes from a ruled PROPOSAL-ab.md (later unit).
# P3-R4: no LiteUtils `gates` job and no stub (P1-R1: hosted CI only after LiteUtils 1.0 is on npm).
# Shallow checkout is fine: no test shells out to git.

name: nightly

on:
  schedule:
    - cron: '41 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  test:
    name: nightly (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    # 30: a first guess; re-size from the first run's wall times
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ['latest', '22']
    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: setup node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          check-latest: true
          cache: npm
      - name: provenance
        run: |
          node --version
          npm --version
          node -p "process.arch + ' ' + process.versions.v8"
          uname -a
      - name: npm ci
        run: npm ci
      - name: npm test
        run: npm test
      - name: npm run torture
        run: npm run torture

  coverage-size:
    name: nightly coverage + size (ubuntu-latest, node 26)
    runs-on: ubuntu-latest
    # 30: a first guess; re-size from the first run's wall times
    timeout-minutes: 30
    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: setup node
        uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
      - name: provenance
        run: |
          node --version
          npm --version
          node -p "process.arch + ' ' + process.versions.v8"
          uname -a
      - name: npm ci
        run: npm ci
      - name: npm run coverage
        run: npm run coverage
      - name: npm run size
        run: npm run size
